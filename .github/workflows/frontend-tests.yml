name: Frontend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager-frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: manager-frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc -p tsconfig.app.json --noEmit
