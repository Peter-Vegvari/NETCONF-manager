[project]
name = "manager-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Peter-Vegvari", email = "vegvaripeter21@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "netconf-console2",
    "netconf-client",
    "basedpyright",
    "ruff",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "six",
    "fastapi[standard]",
    "uvicorn",
    "pyang",
    "pyangbind",
    "lxml",
    "types-lxml",
    "yangson",
    "datamodel-code-generator",
    "wireup>=2.9.0",
]

[project.scripts]
manager-backend = "src:main"

[project.urls]
Homepage = "https://github.com/Peter-Vegvari/NETCONF-manager"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.basedpyright]
venvPath = "."
venv = ".venv"
include = ["src"]
defineConstant = { DEBUG = true }
reportImportCycles = false
failOnWarnings = false
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
reportUnusedParameter = false
allowedUntypedLibraries = ["ncclient", "src"]
reportOptionalContextManager = false

[tool.pytest.ini_options]
minversion = "8.4.1"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I"]
fixable = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
